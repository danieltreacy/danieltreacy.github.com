---
layout: default
---
<article itemscope itemtype="http://schema.org/BlogPosting">
  <h1 class="page-title" itemprop="name headline">{{ page.title | escape }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%-d %B %Y" }}</time>
    {% if page.author %}· <span itemprop="author">{{ page.author }}</span>{% endif %}
  </p>

  <div itemprop="articleBody">
    {{ content }}
  </div>

  {% if site.disqus.shortname %}
    {% include disqus_comments.html %}
  {% endif %}
</article>
