# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Daniel Treacy
email: daniel@danieltreacy.com
description: The next little thing

baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: danieltreacy
github_username:  danieltreacy
instagram_username: danieltreacy
goatcounter: danieltreacy # analytics site code; only loaded in production builds
field_notes_url: "https://fieldnotesonbeingalive.substack.com/?utm_campaign=profile_chips"
substack_url: https://substack.com/danieltreacy
soundcloud_url: https://soundcloud.com/danieltreacy
bandcamp_url: https://danieltreacy.bandcamp.com/
discogs_url: https://www.discogs.com/user/dtreacy

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
exclude:
  - Gemfile
  - Gemfile.lock

# Profile photo shown in the left column (file in assets/, no extension).
# Pages override it with `avatar:` in their front matter.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      avatar: photo-blog
